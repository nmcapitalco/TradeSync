<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="55%" style="stop-color:#F0FDF4"/>
      <stop offset="100%" style="stop-color:#DCFCE7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="25%" cy="85%" r="35%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0"/>
    </radialGradient>
    <style>
      .logo-text { font-family: 'Arial Black', Arial, sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 4px; }
      .headline { font-family: 'Arial Black', Arial, sans-serif; font-size: 72px; font-weight: 900; line-height: 1; letter-spacing: 1px; }
      .sub { font-family: Arial, sans-serif; font-size: 22px; font-weight: 400; }
      .stat-num { font-family: 'Arial Black', Arial, sans-serif; font-size: 38px; font-weight: 900; }
      .stat-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .domain { font-family: 'Courier New', monospace; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Top green bar -->
  <rect width="1200" height="7" fill="url(#bg-bar)"/>
  <linearGradient id="bg-bar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#059669"/>
    <stop offset="100%" style="stop-color:#34D399"/>
  </linearGradient>
  <rect width="1200" height="7" fill="url(#bg-bar)"/>

  <!-- Left accent line -->
  <rect x="80" y="80" width="4" height="140" fill="#059669" rx="2"/>

  <!-- Logo -->
  <circle cx="100" cy="60" r="6" fill="#059669"/>
  <text x="116" y="70" class="logo-text" fill="#0F1623">TRADE<tspan fill="#059669">SYNC</tspan></text>

  <!-- Headline -->
  <text x="92" y="185" class="headline" fill="#0F1623">STOP GUESSING</text>
  <text x="92" y="265" class="headline" fill="#0F1623">THE MARKET.</text>
  <text x="92" y="345" class="headline" fill="#059669">START SYNCING.</text>

  <!-- Sub copy -->
  <text x="92" y="400" class="sub" fill="#475569">Professional strategies. Your brokerage.</text>
  <text x="92" y="430" class="sub" fill="#0F1623" font-weight="600">Every trade executes automatically.</text>

  <!-- Divider -->
  <rect x="92" y="460" width="420" height="1" fill="#E2E8F0"/>

  <!-- Stats -->
  <!-- Stat 1 -->
  <text x="92" y="500" class="stat-num" fill="#059669">$70</text>
  <text x="92" y="520" class="stat-label" fill="#94A3B8">ALL-IN / MONTH</text>

  <!-- Divider -->
  <rect x="232" y="475" width="1" height="50" fill="#E2E8F0"/>

  <!-- Stat 2 -->
  <text x="252" y="500" class="stat-num" fill="#059669">9+</text>
  <text x="252" y="520" class="stat-label" fill="#94A3B8">YRS EXPERIENCE</text>

  <!-- Divider -->
  <rect x="372" y="475" width="1" height="50" fill="#E2E8F0"/>

  <!-- Stat 3 -->
  <text x="392" y="500" class="stat-num" fill="#059669">100%</text>
  <text x="392" y="520" class="stat-label" fill="#94A3B8">AUTOMATED</text>

  <!-- Right side — Ripple animation -->
  <!-- Ref rings -->
  <circle cx="960" cy="315" r="60" fill="none" stroke="#059669" stroke-width="1" opacity="0.12"/>
  <circle cx="960" cy="315" r="110" fill="none" stroke="#059669" stroke-width="0.8" opacity="0.10"/>
  <circle cx="960" cy="315" r="160" fill="none" stroke="#059669" stroke-width="0.6" opacity="0.08"/>
  <circle cx="960" cy="315" r="205" fill="none" stroke="#059669" stroke-width="0.5" opacity="0.06"/>

  <!-- Grid lines -->
  <line x1="720" y1="105" x2="1200" y2="105" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="720" y1="175" x2="1200" y2="175" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="720" y1="245" x2="1200" y2="245" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="720" y1="315" x2="1200" y2="315" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="720" y1="385" x2="1200" y2="385" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="720" y1="455" x2="1200" y2="455" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="800" y1="60" x2="800" y2="580" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="870" y1="60" x2="870" y2="580" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="960" y1="60" x2="960" y2="580" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="1050" y1="60" x2="1050" y2="580" stroke="#059669" stroke-width="0.5" opacity="0.06"/>
  <line x1="1130" y1="60" x2="1130" y2="580" stroke="#059669" stroke-width="0.5" opacity="0.06"/>

  <!-- Dashed connection lines -->
  <line x1="960" y1="315" x2="810" y2="168" stroke="#059669" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.22"/>
  <line x1="960" y1="315" x2="1108" y2="168" stroke="#059669" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.22"/>
  <line x1="960" y1="315" x2="1168" y2="315" stroke="#059669" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.22"/>
  <line x1="960" y1="315" x2="1085" y2="462" stroke="#059669" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.22"/>
  <line x1="960" y1="315" x2="835" y2="462" stroke="#059669" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.22"/>
  <line x1="960" y1="315" x2="755" y2="315" stroke="#059669" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.22"/>

  <!-- Account nodes -->
  <circle cx="810" cy="168" r="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="810" cy="168" r="4" fill="#059669" opacity="0.6"/>

  <circle cx="1108" cy="168" r="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="1108" cy="168" r="4" fill="#059669" opacity="0.6"/>

  <circle cx="1168" cy="315" r="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="1168" cy="315" r="4" fill="#059669" opacity="0.6"/>

  <circle cx="1085" cy="462" r="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="1085" cy="462" r="4" fill="#059669" opacity="0.6"/>

  <circle cx="835" cy="462" r="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="835" cy="462" r="4" fill="#059669" opacity="0.6"/>

  <circle cx="755" cy="315" r="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="755" cy="315" r="4" fill="#059669" opacity="0.6"/>

  <!-- Center node -->
  <circle cx="960" cy="315" r="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <circle cx="960" cy="315" r="5" fill="#059669"/>

  <!-- Domain badge -->
  <rect x="900" y="560" width="220" height="36" rx="18" fill="#059669"/>
  <text x="1010" y="583" class="domain" fill="#ffffff" text-anchor="middle">tradesync.markets</text>
</svg>
